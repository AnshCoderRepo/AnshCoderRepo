
name: Generate trophy card

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ------------------------------------------------------------
      # Diagnostic: verify GitHub token + user API access
      # ------------------------------------------------------------
      - name: Diagnose GitHub API access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          USERNAME="${{ github.repository_owner }}"

          echo "=========================================="
          echo "GitHub API diagnostic"
          echo "=========================================="
          echo "Username: $USERNAME"
          echo "Token available: $([ -n "$GITHUB_TOKEN" ] && echo "YES" || echo "NO")"
          echo

          if [ -z "$GITHUB_TOKEN" ]; then
            echo "ERROR: GITHUB_TOKEN is empty."
            exit 1
          fi

          echo "---- REST API test ----"

          REST_RESPONSE=$(curl -sS \
            -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/$USERNAME")

          echo "$REST_RESPONSE"

          REST_STATUS=$(echo "$REST_RESPONSE" | sed -n 's/HTTP_STATUS://p')

          if [ "$REST_STATUS" != "200" ]; then
            echo
            echo "REST API FAILED with HTTP $REST_STATUS"
          else
            echo
            echo "REST API: OK"
          fi

          echo
          echo "---- GraphQL API test ----"

          GRAPHQL_QUERY='query($username:String!) {
            user(login:$username) {
              login
              id
              name
              createdAt
              followers {
                totalCount
              }
              repositories(first: 1) {
                totalCount
              }
            }
          }'

          GRAPHQL_RESPONSE=$(curl -sS \
            -X POST \
            -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.github+json" \
            --data "$(jq -n \
              --arg query "$GRAPHQL_QUERY" \
              --arg username "$USERNAME" \
              '{query: $query, variables: {username: $username}}')" \
            "https://api.github.com/graphql")

          echo "$GRAPHQL_RESPONSE"

          GRAPHQL_STATUS=$(echo "$GRAPHQL_RESPONSE" | sed -n 's/HTTP_STATUS://p')

          echo
          if [ "$GRAPHQL_STATUS" != "200" ]; then
            echo "GraphQL HTTP request FAILED with HTTP $GRAPHQL_STATUS"
            exit 1
          fi

          GRAPHQL_BODY=$(echo "$GRAPHQL_RESPONSE" | sed '/HTTP_STATUS:/d')

          if echo "$GRAPHQL_BODY" | jq -e '.errors' >/dev/null 2>&1; then
            echo "GraphQL returned ERRORS:"
            echo "$GRAPHQL_BODY" | jq '.errors'
            exit 1
          fi

          if ! echo "$GRAPHQL_BODY" | jq -e '.data.user' >/dev/null 2>&1; then
            echo "GraphQL did not return user data."
            exit 1
          fi

          echo "GraphQL API: OK"
          echo
          echo "=========================================="
          echo "GitHub API diagnostic PASSED"
          echo "=========================================="

      # ------------------------------------------------------------
      # Generate trophy SVG
      # ------------------------------------------------------------
      - name: Generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dracula
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-background: false
          no-frame: false

      # ------------------------------------------------------------
      # Push generated SVG to trophy-output branch
      # ------------------------------------------------------------
      - name: Push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

